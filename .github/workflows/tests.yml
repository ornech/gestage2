name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    # Même moteur qu'en production (MySQL/MariaDB)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gestage2_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, intl, gd, zip, bcmath
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Les vues utilisent @vite : le manifest doit exister pour rendre les pages
      - run: npm ci
      - run: npm run build

      - name: Environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests (MySQL, base gestage2_test)
        run: php artisan test
