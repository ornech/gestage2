name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    # PHP 8.2 = minimum du composer.json ; 8.4 = version de production
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    name: Tests (PHP ${{ matrix.php }})

    # Même moteur qu'en production (MariaDB 11.4 chez O2Switch)
    services:
      mysql:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gestage2_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, intl, gd, zip, bcmath
          coverage: none

      - name: Cache Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Les vues utilisent @vite : le manifest doit exister pour rendre les pages
      - run: npm ci
      - run: npm run build

      - name: Environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests (MariaDB, base gestage2_test)
        run: php artisan test
